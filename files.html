<script>
(async function(){
  const $ = id => document.getElementById(id);
  const BUCKET = 'project-files';
  const KIND = { photo:'写真', drawing:'図面', document:'書類', other:'その他' };
  const LIMIT_BYTES = 1024 * 1024 * 1024;      // 無料プランの目安 1GB

  const auth = await requireAuth();
  if (!auth) return;
  const me = auth.me;
  const isMgr = (me.role === 'admin' || me.role === 'manager');

  paintBar(me, await loadOrgName(me.organization_id));
  $('out').addEventListener('click', signOut);

  let projects = [], phases = [], bbFields = [], files = [], editing = null;
  let projId = null, urlCache = {};

  /* ================= 読み込み ================= */
  async function loadRefs(){
    const [pr, bb] = await Promise.all([
      sb.from('projects').select('id,project_no,name').eq('is_active', true)
        .order('project_no', { ascending:false }),
      sb.from('blackboard_fields').select('*').eq('is_active', true).order('sort_order')
    ]);
    if (pr.error || bb.error){
      showMsg($('msg'), '読み込めませんでした。' + ((pr.error||bb.error).message||''), 'err');
      return;
    }
    projects = pr.data || []; bbFields = bb.data || [];
    $('proj').innerHTML = '<option value="">工事を選んでください</option>' +
      projects.map(x => `<option value="${x.id}">${esc(x.project_no)}　${esc(x.name)}</option>`).join('');
  }

  async function loadPhases(){
    if (!projId){ phases = []; }
    else {
      const { data } = await sb.from('project_phases')
        .select('id,name').eq('project_id', projId).eq('is_active', true).order('seq');
      phases = data || [];
    }
    const opt = phases.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    $('fphase').innerHTML  = '<option value="">すべての工程</option>' + opt;
    $('f_phase').innerHTML = '<option value="">（未設定）</option>' + opt;
    $('u_phase').innerHTML = '<option value="">工程を選ばない</option>' + opt;
  }

  function paintTagHelp(){
    const seen = {};
    files.forEach(f => (f.tags || []).forEach(t => { seen[t] = (seen[t]||0) + 1; }));
    const top = Object.entries(seen).sort((a,b) => b[1]-a[1]).slice(0, 12).map(x => x[0]);
    const fixed = ['施工状況','出来形','使用材料','安全管理','着工前','完成'];
    const all = [...new Set([...fixed, ...top])];

    $('taglist').innerHTML = all.map(t => `<option value="${esc(t)}">`).join('');
    $('chips').innerHTML = all.map(t => `<button class="chip" type="button" data-t="${esc(t)}">${esc(t)}</button>`).join('');
    $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const cur = $('u_tags').value.split(/[、,]/).map(x => x.trim()).filter(Boolean);
      const t = b.dataset.t;
      const i = cur.indexOf(t);
      if (i >= 0) cur.splice(i, 1); else cur.push(t);
      $('u_tags').value = cur.join('、');
      syncChips();
    });
    syncChips();
  }

  function syncChips(){
    const cur = $('u_tags').value.split(/[、,]/).map(x => x.trim()).filter(Boolean);
    $('chips').querySelectorAll('.chip').forEach(b =>
      b.classList.toggle('on', cur.includes(b.dataset.t)));
  }

  async function loadFiles(){
    if (!projId){ files = []; render(); return; }
    const { data, error } = await sb.from('project_files')
      .select('*').eq('project_id', projId).eq('is_active', true)
      .order('taken_on', { ascending:false }).order('created_at', { ascending:false });
    if (error){ showMsg($('msg'), '読み込めませんでした。' + error.message, 'err'); return; }
    files = data || [];
    render();
    paintTagHelp();
    paintUsage();
  }

  let usedPct = 0;

  async function paintUsage(){
    const { data, error } = await sb.rpc('storage_used');
    if (error || !data) return;
    const used = Number(data.bytes) || 0;
    const cnt  = Number(data.files) || 0;
    const mb = used / 1024 / 1024;
    usedPct = used / LIMIT_BYTES * 100;
    $('usage').textContent =
      `保管している量  ${mb.toFixed(1)} MB ／ 上限 1024 MB（${usedPct.toFixed(0)}%・${cnt}件）`;
    $('usage').classList.toggle('warn', usedPct >= 50);
    if (usedPct >= 80)
      showMsg($('msg'),
        '保管領域が残りわずかです。上限に達すると、写真だけでなく工事や日報の保存もできなくなります。', 'err');
  }

  /* ================= 表示 ================= */
  async function signedUrl(path){
    if (!path) return null;
    if (urlCache[path]) return urlCache[path];
    const { data } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
    if (data?.signedUrl) urlCache[path] = data.signedUrl;
    return data?.signedUrl || null;
  }

  /* ---- DXF/DWG図面をその場でSVGにして見せる（LINE/CIRCLE/ARC/LWPOLYLINE/TEXT/簡易的なDIMENSIONのみ対応） ---- */
  function dxfEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  // dxf-parser（DXF）は vertices:[開始,終了] を使い、libredwg-web（DWG）は
  // startPoint/endPoint を使う。どちらでも読めるようにする
  function entitiesToSvg(ents){
    const allX = [], allY = [];
    const bump = (x,y) => { allX.push(x); allY.push(y); };
    const parts = [];

    for (const e of ents){
      switch (e.type){
        case 'LINE': {
          const a = (e.vertices && e.vertices[0]) || e.startPoint;
          const b = (e.vertices && e.vertices[1]) || e.endPoint;
          if (!a || !b) break;
          bump(a.x,a.y); bump(b.x,b.y);
          parts.push(`<line x1="${a.x}" y1="${-a.y}" x2="${b.x}" y2="${-b.y}"/>`);
          break;
        }
        case 'POINT': {
          const p = e.position; if (!p) break;
          bump(p.x,p.y);
          parts.push(`<circle cx="${p.x}" cy="${-p.y}" r="0.3" fill="currentColor" stroke="none"/>`);
          break;
        }
        case 'CIRCLE': {
          const c = e.center; if (!c) break;
          bump(c.x-e.radius,c.y-e.radius); bump(c.x+e.radius,c.y+e.radius);
          parts.push(`<circle cx="${c.x}" cy="${-c.y}" r="${e.radius}"/>`);
          break;
        }
        case 'ARC': {
          const c = e.center; if (!c) break;
          bump(c.x-e.radius,c.y-e.radius); bump(c.x+e.radius,c.y+e.radius);
          const a0 = e.startAngle, a1 = e.endAngle;
          const x0 = c.x + e.radius*Math.cos(a0), y0 = c.y + e.radius*Math.sin(a0);
          const x1 = c.x + e.radius*Math.cos(a1), y1 = c.y + e.radius*Math.sin(a1);
          let sweep = a1 - a0; if (sweep < 0) sweep += Math.PI*2;
          const large = sweep > Math.PI ? 1 : 0;
          parts.push(`<path d="M ${x0} ${-y0} A ${e.radius} ${e.radius} 0 ${large} 0 ${x1} ${-y1}"/>`);
          break;
        }
        case 'LWPOLYLINE': case 'POLYLINE': {
          const pts = (e.vertices || []).map(v => [v.x, v.y]);
          if (!pts.length) break;
          pts.forEach(([x,y]) => bump(x,y));
          const d = pts.map(([x,y],i) => `${i===0?'M':'L'} ${x} ${-y}`).join(' ') + (e.shape ? ' Z' : '');
          parts.push(`<path d="${d}"/>`);
          break;
        }
        case 'TEXT': case 'MTEXT': {
          const p = e.startPoint || e.position; if (!p) break;
          bump(p.x,p.y);
          const h = e.textHeight || e.height || 2.5;
          const txt = dxfEsc((e.text||'').replace(/[{}\\][^;]*;?/g,''));
          parts.push(`<text x="${p.x}" y="${-p.y}" font-size="${h}" transform="rotate(${-(e.rotation||0)} ${p.x} ${-p.y})">${txt}</text>`);
          break;
        }
        case 'DIMENSION': {
          if (e.linearOrAngularPoint1 && e.linearOrAngularPoint2){
            const p1 = e.linearOrAngularPoint1, p2 = e.linearOrAngularPoint2;
            bump(p1.x,p1.y); bump(p2.x,p2.y);
            parts.push(`<line x1="${p1.x}" y1="${-p1.y}" x2="${p2.x}" y2="${-p2.y}" stroke-dasharray="1,1"/>`);
          }
          if (e.middleOfText){
            bump(e.middleOfText.x, e.middleOfText.y);
            parts.push(`<text x="${e.middleOfText.x}" y="${-e.middleOfText.y}" font-size="2.5">${dxfEsc(e.text||'')}</text>`);
          }
          break;
        }
        default: break; // INSERT・SPLINE・ELLIPSE・3DFACE などは今回は対象外
      }
    }

    if (!allX.length) return null;
    // 迷子の参照点など外れ値に全体表示が引っ張られないよう、上下1%を切って範囲を決める
    const pct = (arr, p) => { const s = [...arr].sort((a,b)=>a-b); return s[Math.max(0, Math.min(s.length-1, Math.floor(s.length*p)))]; };
    const minX = pct(allX,0.01), maxX = pct(allX,0.99);
    const minY = pct(allY,0.01), maxY = pct(allY,0.99);
    const w = maxX-minX, h = maxY-minY;
    const pad = Math.max(w,h) * 0.05 || 10;
    const vb = `${minX-pad} ${-maxY-pad} ${w+pad*2} ${h+pad*2}`;
    const sw = Math.max(w,h) / 800;
    return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">
      <rect x="${minX-pad}" y="${-maxY-pad}" width="${w+pad*2}" height="${h+pad*2}" fill="#fff"/>
      <g fill="none" stroke="#16324F" stroke-width="${sw}" color="#16324F" font-family="sans-serif">
        ${parts.join('')}
      </g>
    </svg>`;
  }

  async function renderDxf(path){
    const u = await signedUrl(path);
    if (!u) return '<div class="dxferr">図面を読み込めませんでした。</div>';
    try {
      const buf = await fetch(u).then(r => r.arrayBuffer());
      const text = new TextDecoder('shift-jis').decode(buf);
      const dxf = new DxfParser().parseSync(text);
      const svg = entitiesToSvg(dxf.entities || []);
      return svg || '<div class="dxferr">この図面には表示できる図形（線・円・文字など）が見つかりませんでした。</div>';
    } catch (err){
      return `<div class="dxferr">この図面は表示できませんでした。${dxfEsc(err.message||'')}</div>`;
    }
  }

  // DWGは wasm を使うため、初回に開いたときだけ読み込む
  let libredwgPromise = null;
  function getLibreDwg(){
    if (!libredwgPromise){
      libredwgPromise = import('https://cdn.jsdelivr.net/npm/@mlightcad/libredwg-web@0.7.10/+esm')
        .then(mod => mod.LibreDwg.create().then(lw => ({ lw, Dwg_File_Type: mod.Dwg_File_Type })));
    }
    return libredwgPromise;
  }

  async function renderDwg(path){
    const u = await signedUrl(path);
    if (!u) return '<div class="dxferr">図面を読み込めませんでした。</div>';
    try {
      const buf = await fetch(u).then(r => r.arrayBuffer());
      const { lw, Dwg_File_Type } = await getLibreDwg();
      const dwg = lw.dwg_read_data(new Uint8Array(buf), Dwg_File_Type.DWG);
      if (dwg.error) return `<div class="dxferr">この図面は読み込めませんでした。（エラーコード ${dwg.error}）</div>`;
      const db = lw.convert(dwg);
      lw.dwg_free(db);
      const svg = entitiesToSvg(db.entities || []);
      return svg || '<div class="dxferr">この図面には表示できる図形（線・円・文字など）が見つかりませんでした。</div>';
    } catch (err){
      return `<div class="dxferr">この図面は表示できませんでした。${dxfEsc(err.message||'')}</div>`;
    }
  }

  // Excel・Wordのライブラリも、実際に開くまで読み込まない（サイズが大きいため）
  const scriptPromises = {};
  function loadScript(src){
    if (!scriptPromises[src]){
      scriptPromises[src] = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    return scriptPromises[src];
  }

  async function renderXlsx(path){
    const u = await signedUrl(path);
    if (!u) return '<div class="dxferr">読み込めませんでした。</div>';
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
      const buf = await fetch(u).then(r => r.arrayBuffer());
      const wb = XLSX.read(buf, { type: 'array' });
      const tabs = wb.SheetNames.map((name, i) =>
        `<button class="btn ghost sm xsheet" data-i="${i}" style="margin:0 4px 8px 0">${dxfEsc(name)}</button>`).join('');
      const sheets = wb.SheetNames.map((name, i) =>
        `<div class="xsheetbody" data-i="${i}"${i>0?' hidden':''}>${XLSX.utils.sheet_to_html(wb.Sheets[name], { header:'', footer:'' })}</div>`).join('');
      return `<div class="officebox"><div>${tabs}</div>${sheets}</div>`;
    } catch (err){
      return `<div class="dxferr">このファイルは表示できませんでした。${dxfEsc(err.message||'')}</div>`;
    }
  }

  async function renderDocx(path){
    const u = await signedUrl(path);
    if (!u) return '<div class="dxferr">読み込めませんでした。</div>';
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');
      const buf = await fetch(u).then(r => r.arrayBuffer());
      const result = await mammoth.convertToHtml({ arrayBuffer: buf });
      return `<div class="officebox">${result.value}</div>`;
    } catch (err){
      return `<div class="dxferr">このファイルは表示できませんでした。${dxfEsc(err.message||'')}</div>`;
    }
  }

  function render(){
    const kd = $('fkind').value, ph = $('fphase').value;
    const q  = $('q').value.trim().toLowerCase();

    const rows = files.filter(f => {
      if (kd && f.file_kind !== kd) return false;
      if (ph && f.phase_id !== ph) return false;
      if (!q) return true;
      return [f.title, f.bb_location, f.bb_station, f.original_name, f.description]
        .some(v => (v || '').toLowerCase().includes(q));
    });

    $('count').textContent = projId ? `${rows.length} 件 ／ 全 ${files.length} 件` : '';

    $('photosec').hidden = true; $('docsec').hidden = true;
    $('grid').innerHTML = ''; $('doclist').innerHTML = ''; $('emptymsg').innerHTML = '';

    if (!projId){
      $('emptymsg').innerHTML = `<div class="empty"><b>工事を選んでください</b>上の欄から工事を選ぶと、その資料が出ます。</div>`;
      return;
    }
    if (!rows.length){
      $('emptymsg').innerHTML = `<div class="empty"><b>${files.length ? '該当する資料がありません' : 'まだ資料がありません'}</b>${files.length ? '絞り込みの条件を変えてください。' : '下の「写真・書類を追加する」から取り込んでください。'}</div>`;
      return;
    }

    const isPhoto = f => f.file_kind === 'photo' || (f.mime_type || '').startsWith('image/');
    const photos = rows.filter(isPhoto);
    const docs   = rows.filter(f => !isPhoto(f));

    $('photosec').hidden = !photos.length;
    $('docsec').hidden   = !docs.length;

    $('grid').innerHTML = photos.map(f => {
      const pm = phases.find(p => p.id === f.phase_id);
      return `<button class="card" data-id="${f.id}">
        <span class="ph" data-p="${esc(f.thumb_path || f.storage_path || '')}" data-m="${esc(f.mime_type||'')}" data-th="${f.thumb_path ? 1 : 0}">
          <span class="pill${f.purpose === 'internal' ? ' int' : ''}">${f.purpose === 'submit' ? '提出用' : '社内'}</span>
        </span>
        <span class="cb">
          <span class="c1">${esc(f.title || f.original_name || '（無題）')}</span>
          <span class="c2">${f.taken_on ? fmtDate(f.taken_on) : ''}${pm ? ' ・ ' + esc(pm.name) : ''}</span>
        </span></button>`;
    }).join('');

    $('doclist').innerHTML = docs.map(f => {
      const pm = phases.find(p => p.id === f.phase_id);
      const ext = /\.([A-Za-z0-9]+)$/.exec(f.original_name || '')?.[1]?.toUpperCase() || KIND[f.file_kind] || '';
      const meta = [f.taken_on ? fmtDate(f.taken_on) : '', pm ? pm.name : '', f.purpose === 'internal' ? '社内' : '提出用']
        .filter(Boolean).map(esc);
      return `<button class="item drow" data-id="${f.id}">
        <span class="flag"></span>
        <span class="body">
          <span class="no">${esc(ext)}</span>
          <span style="min-width:0;flex:1 1 auto">
            <span class="nm" style="font-size:13.5px;margin:0">${esc(f.title || f.original_name || '（無題）')}</span>
            <span class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</span>
          </span>
        </span></button>`;
    }).join('');

    $('grid').querySelectorAll('.card').forEach(c => {
      c.addEventListener('click', () => openPanel(files.find(x => x.id === c.dataset.id)));
      const box = c.querySelector('.ph');
      const p = box.dataset.p, m = box.dataset.m;
      if (p && (box.dataset.th === '1' || (m || '').startsWith('image/'))){
        signedUrl(p).then(u => { if (u) box.insertAdjacentHTML('beforeend',
          `<img src="${u}" alt="" loading="lazy">`); });
      }
    });
    $('doclist').querySelectorAll('.drow').forEach(c => {
      c.addEventListener('click', () => openPanel(files.find(x => x.id === c.dataset.id)));
    });
  }

  $('proj').addEventListener('change', async () => {
    projId = $('proj').value || null;
    const u = new URL(location.href);
    if (projId) u.searchParams.set('p', projId); else u.searchParams.delete('p');
    history.replaceState(null, '', u);
    $('dock').hidden = !projId;
    $('up').hidden = true;
    await loadPhases();
    await loadFiles();
  });
  $('fkind').addEventListener('change', render);
  $('fphase').addEventListener('change', render);
  $('q').addEventListener('input', render);

  /* ================= 取り込み ================= */
  let devPos = null;

  async function askPosition(){
    $('geo').className = 'geo';
    $('geo').textContent = '位置情報：確認しています…';
    devPos = await currentPosition(8000);
    if (devPos){
      $('geo').className = 'geo ok';
      $('geo').textContent =
        `位置情報：取得できました（誤差およそ ${Math.round(devPos.acc)}m）。` +
        `写真に位置が記録されていればそちらを優先します。`;
    } else {
      $('geo').className = 'geo ng';
      $('geo').textContent =
        '位置情報：端末から取得できませんでした。写真に記録された位置があればそれを使います。' +
        'ブラウザの位置情報の許可をご確認ください。';
    }
  }

  $('add').addEventListener('click', () => {
    $('up').hidden = !$('up').hidden;
    if (!$('up').hidden){
      askPosition();
      $('up').scrollIntoView({ behavior:'smooth', block:'start' });
    }
  });

  // 選んだファイルを溜める（撮影と選択の両方から足せる）
  let picked = [];

  function paintPicked(){
    $('picked').innerHTML = picked.map((f,i) => {
      const mb = (f.size/1024/1024).toFixed(1);
      return `<div class="pk"><img data-i="${i}" alt="">` +
             `<span class="nm2">${esc(f.name)}</span>` +
             `<span class="sz">${mb}MB</span>` +
             `<button class="btn ghost sm pk_rm" data-i="${i}" type="button">外す</button></div>`;
    }).join('');
    $('picked').querySelectorAll('.pk img').forEach(im => {
      const f = picked[Number(im.dataset.i)];
      if (f && f.type.startsWith('image/')) im.src = URL.createObjectURL(f);
    });
    $('picked').querySelectorAll('.pk_rm').forEach(b => b.onclick = () => {
      picked.splice(Number(b.dataset.i), 1); paintPicked();
    });
    $('u_go').textContent = picked.length ? `${picked.length}件を取り込む` : '取り込む';
  }

  $('cambtn').addEventListener('click', () => $('cam').click());
  $('filebtn').addEventListener('click', () => $('file').click());

  function accept(e){
    picked = picked.concat([...e.target.files]);
    e.target.value = '';
    paintPicked();
  }
  $('u_tags').addEventListener('input', syncChips);
  $('cam').addEventListener('change', accept);
  $('file').addEventListener('change', accept);

  function safeName(n){
    return n.replace(/[^\w.\-]/g, '_').slice(-80);
  }

  $('u_go').addEventListener('click', async () => {
    const list = picked;
    if (!projId){ showMsg($('msg'), '工事を選んでください。', 'err'); return; }
    if (!list.length){
      showMsg($('msg'), '「カメラで撮る」か「保存済みから選ぶ」で写真を選んでください。', 'err');
      return;
    }

    if (usedPct >= 80 &&
        !confirm(`保管領域を ${usedPct.toFixed(0)}% 使っています。\n上限に達すると工事や日報の保存もできなくなります。\n\nこのまま取り込みますか。`)) return;

    const purpose = $('u_purpose').value;
    const phase   = $('u_phase').value || null;
    const utitle  = $('u_title').value.trim() || null;
    const utags   = $('u_tags').value.split(/[、,]/).map(x => x.trim()).filter(Boolean);
    $('u_go').disabled = true;
    let ok = 0, ng = 0, geoOk = 0;

    for (let i = 0; i < list.length; i++){
      const f = list[i];
      $('prog').textContent = `${i+1} / ${list.length} 件目を取り込んでいます…（${f.name}）`;
      const stamp = Date.now() + '_' + i;
      const base  = `${me.organization_id}/${projId}`;
      const nm    = safeName(f.name);

      try {
        let origBlob = f, w = null, h = null;

        // 写真は用途に応じた大きさに落として保存する
        //   提出用 : 長辺2000px（A4半分に約242dpi＝きれいに印刷できる）
        //   社内用 : 長辺1200px
        if (f.type.startsWith('image/')){
          const edge = (purpose === 'submit') ? 2000 : 1200;
          const q    = (purpose === 'submit') ? 0.85 : 0.75;
          const r = await shrinkImage(f, edge, q);
          if (r){ origBlob = r.blob; w = r.w; h = r.h; }
        }

        const origPath = `${base}/orig/${stamp}_${nm}`;
        const up1 = await sb.storage.from(BUCKET)
          .upload(origPath, origBlob, { contentType: f.type || 'application/octet-stream' });
        if (up1.error) throw up1.error;

        // 表示用の絵（画像は縮小、PDFは1ページ目）
        let thumbPath = null;
        const t = await makeThumb(f, 900, 0.75);
        if (t){
          thumbPath = `${base}/thumb/${stamp}_${nm}.jpg`;
          const up2 = await sb.storage.from(BUCKET)
            .upload(thumbPath, t, { contentType:'image/jpeg' });
          if (up2.error) thumbPath = null;
        }

        // 撮影位置：写真に記録があればそれを、無ければ端末の位置を使う
        const geo = await resolveGeo(f, devPos);

        const { error } = await sb.from('project_files').insert({
          organization_id: me.organization_id,
          project_id     : projId,
          file_kind      : f.type.startsWith('image/') ? 'photo'
                          : (f.type === 'application/pdf' ? 'document' : 'other'),
          purpose        : purpose,
          storage_path   : origPath,
          thumb_path     : thumbPath,
          original_name  : f.name,
          mime_type      : f.type || null,
          byte_size      : origBlob.size,
          width_px       : w, height_px: h,
          phase_id       : phase,
          title          : list.length > 1 && utitle ? `${utitle}（${i+1}）` : utitle,
          tags           : utags,
          taken_on       : (geo.at ? geo.at.slice(0,10)
                            : new Date(f.lastModified || Date.now()).toISOString().slice(0,10)),
          captured_at    : geo.at ? new Date(geo.at).toISOString() : null,
          lat            : geo.lat, lng: geo.lng,
          geo_source     : geo.source,
          geo_accuracy_m : geo.acc,
          uploaded_by    : me.id
        });
        if (error) throw error;
        ok++;
        if (geo.lat !== null) geoOk++;
      } catch (e){
        ng++;
        console.error(e);
      }
    }

    $('u_go').disabled = false;
    picked = [];
    paintPicked();
    $('u_title').value = '';
    $('prog').textContent = '';
    showMsg($('msg'),
      `${ok}件を取り込みました。${ng ? `${ng}件は失敗しました。` : ''}` +
      (geoOk ? `　うち ${geoOk}件に撮影位置を記録しました。` : '　撮影位置は記録できませんでした。'),
      ng ? 'err' : 'ok');
    await loadFiles();
  });

  /* ================= 詳細 ================= */
  function bbHtml(f){
    return bbFields.map(b => {
      const col = { work_type:'bb_work_type', station:'bb_station',
                    location:'bb_location', witness:'bb_witness' }[b.field_key];
      const v = f ? (col ? (f[col] || '') : ((f.bb_extra || {})[b.field_key] || '')) : '';
      return `<div class="row">
        <label for="bb_${b.field_key}">${esc(b.label)}</label>
        <div class="fld"><input id="bb_${b.field_key}" type="text"
          data-key="${esc(b.field_key)}" data-col="${col || ''}" value="${esc(v)}"></div>
      </div>`;
    }).join('');
  }

  async function openPanel(f){
    editing = f || null;
    if (!f) return;
    showMsg($('pmsg'), '');

    const canEd = isMgr || f.uploaded_by === me.id;
    $('ptitle').textContent = KIND[f.file_kind] || '資料';
    $('f_title').value   = f.title || '';
    $('f_kind').value    = f.file_kind;
    $('f_purpose').value = f.purpose;
    $('f_taken').value   = f.taken_on || '';
    $('f_phase').value   = f.phase_id || '';
    $('f_tags').value    = (f.tags || []).join('、');
    $('f_desc').value    = f.description || '';
    $('bbrows').innerHTML = bbHtml(f);

    // 大きい画像・DXF/DWG図面・PDF・Excel・Word
    $('big').hidden = true; $('big').innerHTML = ''; $('big').classList.remove('dxf', 'pdf', 'office');
    if ((f.mime_type || '').startsWith('image/')){
      const u = await signedUrl(f.storage_path);
      if (u){ $('big').innerHTML = `<img src="${u}" alt="">`; $('big').hidden = false; }
    } else if (/\.dxf$/i.test(f.original_name || '')){
      $('big').classList.add('dxf');
      $('big').innerHTML = '<div class="dxferr">図面を読み込んでいます…</div>';
      $('big').hidden = false;
      renderDxf(f.storage_path).then(html => { if (editing === f) $('big').innerHTML = html; });
    } else if (/\.dwg$/i.test(f.original_name || '')){
      $('big').classList.add('dxf');
      $('big').innerHTML = '<div class="dxferr">図面を読み込んでいます…</div>';
      $('big').hidden = false;
      renderDwg(f.storage_path).then(html => { if (editing === f) $('big').innerHTML = html; });
    } else if (f.mime_type === 'application/pdf' || /\.pdf$/i.test(f.original_name || '')){
      const u = await signedUrl(f.storage_path);
      if (u){
        $('big').classList.add('pdf');
        $('big').innerHTML = `<iframe src="${esc(u)}" title="${esc(f.original_name||'PDF')}"></iframe>`;
        $('big').hidden = false;
      }
    } else if (/\.xlsx?$/i.test(f.original_name || '')){
      $('big').classList.add('office');
      $('big').innerHTML = '<div class="officebox">読み込んでいます…</div>';
      $('big').hidden = false;
      renderXlsx(f.storage_path).then(html => {
        if (editing !== f) return;
        $('big').innerHTML = html;
        const box = $('big');
        box.querySelectorAll('.xsheet').forEach(btn => btn.addEventListener('click', () => {
          box.querySelectorAll('.xsheetbody').forEach(b => b.hidden = (b.dataset.i !== btn.dataset.i));
        }));
      });
    } else if (/\.docx$/i.test(f.original_name || '')){
      $('big').classList.add('office');
      $('big').innerHTML = '<div class="officebox">読み込んでいます…</div>';
      $('big').hidden = false;
      renderDocx(f.storage_path).then(html => { if (editing === f) $('big').innerHTML = html; });
    }

    const mb = (Number(f.byte_size)||0) / 1024 / 1024;
    const SRC = { exif:'写真に記録されていた位置', device:'取り込んだ端末の位置',
                  manual:'手で入れた位置', none:'取得できず' };
    const geoHtml = (f.lat !== null && f.lat !== undefined)
      ? `<div class="geobox">撮影位置　<a href="https://www.google.com/maps?q=${f.lat},${f.lng}" target="_blank" rel="noopener">` +
        `${Number(f.lat).toFixed(6)}, ${Number(f.lng).toFixed(6)}</a>` +
        `<br><span class="src">${esc(SRC[f.geo_source] || '')}` +
        `${f.geo_accuracy_m ? `　誤差およそ ${Math.round(f.geo_accuracy_m)}m` : ''}</span></div>`
      : `<div class="geobox" style="color:#9AA39C">撮影位置は記録されていません</div>`;

    $('meta').innerHTML =
      `<div class="msg" style="margin:0 0 10px;font-family:var(--mono);font-size:12px">
        ${esc(f.original_name || '')}<br>
        ${mb.toFixed(2)} MB${f.width_px ? `　${f.width_px}×${f.height_px}` : ''}` +
        `${f.captured_at ? `<br>撮影 ${fmtDate(f.captured_at.slice(0,10))} ${f.captured_at.slice(11,16)}` : ''}<br>
        ${f.purpose === 'submit' ? '提出用：A4半分に印刷できる画質で保存' : '社内の記録：軽くして保存'}
      </div>
      <div class="msg" style="margin:0">${geoHtml}</div>`;

    document.querySelectorAll('#panel input, #panel select, #panel textarea')
      .forEach(el => el.disabled = !canEd);
    $('pdock').style.display = canEd ? '' : 'none';
    $('del').hidden = !isMgr;

    $('panel').classList.add('open');
    window.scrollTo(0,0);
  }

  function closePanel(){ $('panel').classList.remove('open'); editing = null; }
  $('close').addEventListener('click', closePanel);
  $('cancel').addEventListener('click', closePanel);

  $('dl').addEventListener('click', async () => {
    if (!editing) return;
    const u = await signedUrl(editing.storage_path);
    if (u) window.open(u, '_blank');
    else showMsg($('pmsg'), '原本を開けませんでした。', 'err');
  });

  /* ================= 保存 ================= */
  $('save').addEventListener('click', async () => {
    if (!editing) return;
    showMsg($('pmsg'), '');

    const body = {
      title      : $('f_title').value.trim() || null,
      file_kind  : $('f_kind').value,
      purpose    : $('f_purpose').value,
      taken_on   : $('f_taken').value || null,
      phase_id   : $('f_phase').value || null,
      description: $('f_desc').value.trim() || null,
      tags       : $('f_tags').value.split(/[、,]/).map(s => s.trim()).filter(Boolean),
      bb_extra   : {}
    };
    $('bbrows').querySelectorAll('input').forEach(el => {
      const v = el.value.trim();
      if (el.dataset.col) body[el.dataset.col] = v || null;
      else if (v) body.bb_extra[el.dataset.key] = v;
    });

    $('save').disabled = true; $('save').textContent = '保存しています…';
    const { error } = await sb.from('project_files').update(body).eq('id', editing.id);
    $('save').disabled = false; $('save').textContent = '保存する';

    if (error){ showMsg($('pmsg'), '保存できませんでした。' + error.message, 'err'); return; }
    closePanel(); await loadFiles();
    showMsg($('msg'), '保存しました。', 'ok');
  });

  /* ================= 削除 ================= */
  $('del').addEventListener('click', async () => {
    if (!editing) return;
    if (!confirm('この資料を削除します。原本も消えます。取り消せません。')) return;
    const paths = [editing.storage_path, editing.thumb_path].filter(Boolean);
    await sb.storage.from(BUCKET).remove(paths);
    const { error } = await sb.from('project_files').delete().eq('id', editing.id);
    if (error){ showMsg($('pmsg'), '削除できませんでした。' + error.message, 'err'); return; }
    closePanel(); await loadFiles();
    showMsg($('msg'), '削除しました。', 'ok');
  });

  /* ================= 起動 ================= */
  await loadRefs();
  const q = new URL(location.href).searchParams.get('p');
  if (q && projects.some(x => x.id === q)){ projId = q; $('proj').value = q; $('dock').hidden = false; }
  await loadPhases();
  await loadFiles();
})();
</script>
</body>
</html>
