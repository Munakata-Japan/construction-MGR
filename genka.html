<!DOCTYPE html>
<!-- BUILD: genka (着工前原価台帳) v20260904A -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>着工前原価台帳 ｜ 宗像総合管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* 横に長い表を扱うため、共通の960pxより広く使う */
  .wrap{ max-width:1440px; }

  /* ページ自体はスクロールさせず、表の中だけをスクロールさせる（二重スクロール防止） */
  html, body{ height:100%; }
  body{ overflow:hidden; display:flex; flex-direction:column; }
  .bar{ flex:0 0 auto; }
  .wrap{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; padding-top:10px; }
  .lead, .ctl, #msg, .sumgrid, .count{ flex:0 0 auto; }
  #gtable{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

  .lead{ color:var(--sub); font-size:12.5px; line-height:1.6; margin:0 0 8px; }

  .ctl{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .ctl select{ width:auto; min-width:160px; max-width:360px; min-height:38px; flex:0 1 auto; }
  .ctl .sp{ flex:1 1 0; }

  .sumgrid{ display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); margin-bottom:10px; }
  .sumcard{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
    box-shadow:var(--shadow-1); padding:8px 12px;
  }
  .sumcard .t{ font-size:11px; color:var(--sub); margin-bottom:3px; }
  .sumcard .v{ font-family:var(--mono); font-weight:700; font-size:18px; color:var(--ink); }

  .gtable{ background:var(--card); border:1px solid var(--rule); border-radius:var(--radius);
           box-shadow:var(--shadow-1); overflow:auto; flex:1 1 auto; min-height:0; }
  .ghead, .grow{
    display:grid; align-items:start; gap:6px; min-width:980px;
    grid-template-columns:40px 54px 2.2fr 1.4fr 1.1fr 78px 96px 116px;
  }
  .ghead{
    position:sticky; top:0; z-index:5;
    background:#F1F3EF; font-size:10.5px; font-weight:700; color:var(--sub);
    white-space:nowrap; align-items:center; padding:6px 12px;
    border-bottom:1px solid var(--rule); border-radius:var(--radius) var(--radius) 0 0;
  }
  .grow{
    padding:9px 12px; border-top:1px solid var(--rule-2); background:var(--card);
    font-size:12.5px; text-align:left; width:100%; font-family:var(--body); color:inherit;
    text-decoration:none; cursor:pointer;
  }
  .grow:hover{ background:#F5F7F3; }
  .grow .rno, .ghead .rno{ font-family:var(--mono); font-size:11px; color:var(--sub); text-align:right; }
  .grow .num{ font-family:var(--mono); text-align:right; white-space:nowrap; }
  .ghead .num{ text-align:right; }
  .grow .nm{ white-space:normal; overflow-wrap:break-word; line-height:1.4; font-weight:700; }
  .grow .sub{ white-space:normal; overflow-wrap:break-word; line-height:1.4; color:var(--sub); }
  .cat{ font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:var(--radius-sm); text-align:center; }
  .cat.material{ background:#E3EBF3; color:var(--ink-2); }
  .cat.labor{ background:#FBF1EF; color:#8C2A1D; }
  .gphase{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 12px; background:#E9ECE4; border-top:1px solid var(--rule);
    font-size:11.5px; font-weight:700; color:var(--ink-2);
  }
  .gphase:first-child{ border-top:none; }
  .gphase .gc{ font-weight:400; color:var(--sub); font-family:var(--mono); font-size:11px; }
  .gfoot{
    position:sticky; bottom:0; z-index:4;
    display:grid; grid-template-columns:40px 54px 2.2fr 1.4fr 1.1fr 78px 96px 116px;
    min-width:980px; gap:6px; padding:9px 12px; border-top:2px solid var(--ink);
    font-weight:700; background:#F5F7F3;
  }
  .gfoot .num{ font-family:var(--mono); text-align:right; white-space:nowrap; }

  /* 工種セクション（ドラッグの受け皿）と行のドラッグ */
  .gcat{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 12px; background:#E9ECE4; border-top:1px solid var(--rule);
    font-size:12.5px; font-weight:700; color:var(--ink);
  }
  .gcat:first-child{ border-top:none; }
  .gcat .gc{ font-weight:400; color:var(--sub); font-family:var(--mono); font-size:11px; }
  .gcat.dragover{ background:#FBEFC9; outline:2px dashed var(--safety); outline-offset:-2px; }
  .gh{ cursor:grab; color:#AAB1A9; user-select:none; margin-right:2px; }
  .grow[draggable="true"]{ cursor:pointer; }
  .grow.dragging{ opacity:.4; }
  .grow.dropbefore{ box-shadow:inset 0 3px 0 var(--safety); }
  .grow.dropafter{ box-shadow:inset 0 -3px 0 var(--safety); }
  .addcat{ display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .addcat input{ width:auto; flex:0 1 220px; min-width:0; min-height:34px; }

  @media (max-width:820px){
    /* 狭い画面ではカード表示になるため、通常のページスクロールに戻す */
    body{ height:auto; overflow:visible; display:block; }
    .wrap{ flex:none; height:auto; overflow:visible; display:block; }
    #gtable{ display:block; }
    .gtable{ flex:none; max-height:none; overflow:visible; }
    .ghead, .gfoot{ display:none; }
    .grow{ grid-template-columns:1fr; min-width:0; padding:11px 12px; gap:3px; }
    .grow .num{ text-align:left; }
    .grow .rno{ text-align:left; }
  }
</style>
</head>
<body>

<header class="bar">
  <span class="mark" aria-hidden="true"></span>
  <h1>着工前原価台帳</h1>
  <div class="who" id="who"></div>
</header>

<div class="wrap">
  <p class="lead">
    見積先から取った材工の見積を、工事ごとに1件ずつ明細で並べた
    <b>着工前の原価</b>です。<b>行の左の ⠿ をつかんでドラッグ</b>すると、
    「土木工事」「電気工事」などの工種へ振り分け・並べ替えができます。
    工事が進む中で出てくる副資材や突発的な費用は「実行予算」に記録します。
  </p>

  <div class="ctl">
    <select id="proj"><option value="">工事を選んでください</option></select>
    <select id="fcat">
      <option value="">材工すべて</option>
      <option value="material">材料費のみ</option>
      <option value="labor">外注・労務費のみ</option>
    </select>
    <span class="sp"></span>
  </div>

  <div class="addcat">
    <input id="newcat" type="text" placeholder="工種を追加（例：塗装工事）">
    <button class="btn ghost sm" id="addcat" type="button">＋ 工種を追加</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="sumgrid" id="sumgrid" hidden></div>

  <p class="count" id="count"></p>
  <div id="gtable"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function(){
  const $ = id => document.getElementById(id);

  const auth = await requireAuth();
  if (!auth) return;
  const me = auth.me;

  paintBar(me, await loadOrgName(me.organization_id));

  let projects = [], partners = [], phases = [], items = [], projId = null;

  // 工種：まず土木・電気・共通を用意。ユーザーが「＋工種を追加」で増やせる
  const DISC = ['土木工事', '電気工事', '共通'];
  let customCats = [];
  let draggingId = null;

  async function loadRefs(){
    const [pr, pt] = await Promise.all([
      sb.from('projects').select('id,project_no,name').eq('is_active', true).order('project_no', { ascending:false }),
      sb.from('partners').select('id,name').eq('is_active', true).order('name')
    ]);
    projects = pr.data || [];
    partners = pt.data || [];
    $('proj').innerHTML = '<option value="">工事を選んでください</option>' +
      projects.map(x => `<option value="${x.id}">${esc(x.project_no)}　${esc(x.name)}</option>`).join('');
  }

  async function loadPhases(){
    if (!projId){ phases = []; return; }
    const { data } = await sb.from('project_phases')
      .select('id,name').eq('project_id', projId).eq('is_active', true).order('seq');
    phases = data || [];
  }

  async function loadItems(){
    if (!projId){ items = []; render(); return; }
    // 着工前の見積原価だけ（cost_stage=estimate）。中止は除く
    const { data, error } = await sb.from('phase_budget_items')
      .select('id,phase_id,category,item_name,estimate_partner_id,quantity,unit,unit_price,amount,status,cost_stage,note,seq,discipline,sort_order')
      .eq('project_id', projId).order('seq');
    if (error){
      showMsg($('msg'),
        /column .* does not exist|schema cache|relation .* does not exist/i.test(error.message || '')
          ? 'データベースに必要な項目がまだありません。Supabase の SQL Editor で phase3_budget.sql・phase8_cost_stage.sql・phase13_discipline.sql を実行してください。'
          : '読み込めませんでした。' + error.message, 'err');
      items = [];
    } else {
      items = (data || []).filter(x => (x.cost_stage || 'estimate') === 'estimate' && x.status !== 'cancelled');
    }
    render();
  }

  function fmt(v){ return (v || v === 0) ? fmtMoney(v) : '—'; }

  function render(){
    if (!projId){
      $('sumgrid').hidden = true;
      $('count').textContent = '';
      $('gtable').innerHTML = `<div class="hold" style="height:200px"><div class="empty"><b>工事を選んでください</b>上の欄から工事を選ぶと、着工前の見積原価が出ます。</div></div>`;
      return;
    }

    const fc = $('fcat').value;
    const rows = items.filter(x => !fc || x.category === fc);
    const ptmap = Object.fromEntries(partners.map(p => [p.id, p.name]));
    const phmap = Object.fromEntries(phases.map(p => [p.id, p.name]));

    const sum = (arr, k) => arr.reduce((s, x) => s + (Number(x[k]) || 0), 0);
    const sMat = sum(rows.filter(x => x.category === 'material'), 'amount');
    const sLab = sum(rows.filter(x => x.category === 'labor'), 'amount');
    const sAll = sMat + sLab;

    $('sumgrid').hidden = false;
    $('sumgrid').innerHTML = `
      <div class="sumcard"><div class="t">材料費（見積）</div><div class="v">${fmtMoney(sMat)}</div></div>
      <div class="sumcard"><div class="t">労務・外注費（見積）</div><div class="v">${fmtMoney(sLab)}</div></div>
      <div class="sumcard"><div class="t">着工前原価 合計</div><div class="v">${fmtMoney(sAll)}</div></div>
    `;

    $('count').textContent = `${rows.length} 件 ／ 全 ${items.length} 件`;

    if (!rows.length){
      $('gtable').innerHTML = `<div class="empty"><b>着工前原価の明細がありません</b>実行予算で見積を入れると、ここに着工前原価として出ます。</div>`;
      return;
    }

    // 工種の並び（土木・電気・共通 → ユーザー追加 → データにある工種）。末尾に「未分類」
    const sections = [];
    const present = [...new Set(items.map(x => x.discipline).filter(Boolean))];
    [...DISC, ...customCats, ...present].forEach(s => { if (s && !sections.includes(s)) sections.push(s); });

    const NONE = '__none__';
    const byDisc = new Map();
    sections.forEach(s => byDisc.set(s, []));
    byDisc.set(NONE, []);
    rows.forEach(x => {
      const key = (x.discipline && byDisc.has(x.discipline)) ? x.discipline : (x.discipline || NONE);
      if (!byDisc.has(key)) byDisc.set(key, []);
      byDisc.get(key).push(x);
    });
    const ord = (a, b) => ((a.sort_order || 0) - (b.sort_order || 0)) || ((a.seq || 0) - (b.seq || 0));

    let h = `<div class="gtable"><div class="ghead">
      <span class="rno">NO</span><span>区分</span><span>品名</span><span>見積先</span><span>工程</span>
      <span class="num">数量</span><span class="num">単価</span><span class="num">見積金額</span>
    </div>`;
    let no = 0;
    const sectOrder = [...sections, NONE];
    sectOrder.forEach(sec => {
      const arr = (byDisc.get(sec) || []).slice().sort(ord);
      // 既定・追加した工種セクションは空でも受け皿として表示。未分類は中身があるときだけ
      if (!arr.length && sec === NONE) return;
      const label = sec === NONE ? '未分類' : sec;
      const dattr = sec === NONE ? '' : esc(sec);
      h += `<div class="gcat" data-disc="${dattr}"><span>${esc(label)}</span>` +
        `<span class="gc">${arr.length} 件 ・ ${fmtMoney(sum(arr, 'amount'))}</span></div>`;
      arr.forEach(x => {
        no++;
        h += `<div class="grow" draggable="true" data-id="${x.id}" data-disc="${dattr}">
          <span class="rno"><span class="gh" title="ドラッグして工種へ移動・並べ替え">⠿</span>${no}</span>
          <span class="cat ${x.category}">${x.category === 'material' ? '材' : '工'}</span>
          <span class="nm" title="${esc(x.item_name)}">${esc(x.item_name)}${x.note ? `<span class="sub">${esc(x.note)}</span>` : ''}</span>
          <span>${esc(ptmap[x.estimate_partner_id] || '—')}</span>
          <span>${esc(phmap[x.phase_id] || '（工事全体）')}</span>
          <span class="num">${x.quantity ?? ''}${x.unit ? esc(x.unit) : ''}</span>
          <span class="num">${fmt(x.unit_price)}</span>
          <span class="num">${fmt(x.amount)}</span>
        </div>`;
      });
    });
    h += `<div class="gfoot">
      <span></span><span></span><span>着工前原価 合計</span><span></span><span></span>
      <span></span><span></span><span class="num">${fmtMoney(sAll)}</span>
    </div>`;
    h += `</div>`;
    $('gtable').innerHTML = h;
    wireDrag();
  }

  /* ================= ドラッグで工種へ振り分け・並べ替え ================= */
  function clearInd(){
    $('gtable').querySelectorAll('.dropbefore,.dropafter,.dragover')
      .forEach(el => el.classList.remove('dropbefore', 'dropafter', 'dragover'));
  }

  function wireDrag(){
    const tbl = $('gtable');
    tbl.querySelectorAll('.grow').forEach(row => {
      row.addEventListener('click', () => {
        // クリックはその品目の入力画面（実行予算）を開く（確認→入力の統一）
        if (row.dataset.moved){ delete row.dataset.moved; return; }
        location.href = `budget.html?p=${projId}&item=${row.dataset.id}`;
      });
      row.addEventListener('dragstart', e => {
        draggingId = row.dataset.id;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', row.dataset.id); } catch (_) {}
      });
      row.addEventListener('dragend', () => { row.classList.remove('dragging'); clearInd(); });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        clearInd();
        const rect = row.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height / 2;
        row.classList.add(after ? 'dropafter' : 'dropbefore');
      });
      row.addEventListener('drop', async e => {
        e.preventDefault(); e.stopPropagation();
        const rect = row.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height / 2;
        const targetDisc = row.dataset.disc || '';
        const refId = row.dataset.id;
        clearInd();
        await doMove(draggingId, targetDisc, refId, after);
      });
    });
    tbl.querySelectorAll('.gcat').forEach(sec => {
      sec.addEventListener('dragover', e => { e.preventDefault(); sec.classList.add('dragover'); });
      sec.addEventListener('dragleave', () => sec.classList.remove('dragover'));
      sec.addEventListener('drop', async e => {
        e.preventDefault();
        sec.classList.remove('dragover');
        await doMove(draggingId, sec.dataset.disc || '', null, false);
      });
    });
  }

  async function doMove(draggedId, targetDisc, refId, after){
    if (!draggedId) return;
    if (refId && refId === draggedId) return;   // 自分自身の上に落としたときは何もしない
    const dragged = items.find(x => x.id === draggedId);
    if (!dragged) return;
    // ドラッグ後の誤クリック（入力画面へ飛ぶ）を1回抑制する
    const el = $('gtable').querySelector(`.grow[data-id="${draggedId}"]`);
    if (el) el.dataset.moved = '1';

    // 移動先の工種にある行（自分を除く）を今の並びで取り出す
    const inSec = items
      .filter(x => x.id !== draggedId && ((x.discipline || '') === targetDisc))
      .sort((a, b) => ((a.sort_order || 0) - (b.sort_order || 0)) || ((a.seq || 0) - (b.seq || 0)));

    let idx = inSec.length;
    if (refId){
      const i = inSec.findIndex(x => x.id === refId);
      if (i >= 0) idx = after ? i + 1 : i;
    }
    inSec.splice(idx, 0, dragged);

    // 並び順を振り直し、変わった行だけ保存する
    const updates = [];
    inSec.forEach((x, i) => {
      const so = (i + 1) * 10;
      if (x.id === draggedId){
        const disc = targetDisc || null;
        updates.push({ id: x.id, body: { sort_order: so, discipline: disc } });
        x.sort_order = so; x.discipline = disc;
      } else if ((x.sort_order || 0) !== so){
        updates.push({ id: x.id, body: { sort_order: so } });
        x.sort_order = so;
      }
    });

    render();  // 見た目は先に反映（ローカルは更新済み）
    if (!updates.length) return;
    try {
      await Promise.all(updates.map(async u => {
        const { error } = await sb.from('phase_budget_items').update(u.body).eq('id', u.id);
        if (error) throw error;
      }));
    } catch (err){
      showMsg($('msg'),
        /column .* does not exist|schema cache/i.test(err.message || '')
          ? '工種の保存に必要な項目がまだありません。Supabase で phase13_discipline.sql を実行してください。'
          : '並び順を保存できませんでした。' + (err.message || ''), 'err');
    }
  }

  $('addcat').addEventListener('click', () => {
    const v = $('newcat').value.trim();
    if (!v) return;
    if (!DISC.includes(v) && !customCats.includes(v)) customCats.push(v);
    $('newcat').value = '';
    render();
  });
  $('newcat').addEventListener('keydown', e => { if (e.key === 'Enter') $('addcat').click(); });

  $('fcat').addEventListener('change', render);
  $('proj').addEventListener('change', async () => {
    projId = $('proj').value || null;
    // 選んだ工事をURLに残す（別ページから戻ってきても選択が残るように）
    const u = new URL(location.href);
    if (projId) u.searchParams.set('p', projId); else u.searchParams.delete('p');
    history.replaceState(null, '', u);
    await loadPhases();
    await loadItems();
  });

  /* ================= 起動 ================= */
  await loadRefs();
  const q = new URL(location.href).searchParams.get('p');
  if (q && projects.some(x => x.id === q)){
    $('proj').value = q; projId = q;
    await loadPhases();
    await loadItems();
  } else {
    render();
  }
})();
</script>
</body>
</html>
