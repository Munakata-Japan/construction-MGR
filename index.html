  /* ===== 起動スプラッシュ（図面×安全イエロー：太陽光・蓄電所サイトを製図） ===== */
  .splash{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(125% 100% at 50% -8%, #1E4A7A 0%, #13385D 46%, #0B2540 100%);
    color:#fff; overflow:hidden; transition:opacity .6s ease; }
  .splash.gone{ opacity:0; pointer-events:none; }
  .sp-grid{ position:absolute; inset:-2px; opacity:.55;
    background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(78% 68% at 50% 44%, #000 52%, transparent 100%);
            mask-image:radial-gradient(78% 68% at 50% 44%, #000 52%, transparent 100%); }
  .sp-core{ position:relative; text-align:center; padding:0 20px; }
  .sp-emblem{ width:min(76vw,250px); height:auto; display:block; margin:0 auto 20px;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,.35)); }
  .sp-emblem .st{ fill:none; stroke:#E9EEF5; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .sp-emblem .yl{ stroke:var(--safety); }
  .sp-emblem .fillyl{ fill:var(--safety); stroke:none; opacity:0; }
  .sp-emblem .sp-draw{ stroke-dasharray:100; stroke-dashoffset:100; }
  .sp-word{ display:inline-flex; align-items:center; gap:13px; opacity:0; transform:translateY(9px); }
  .sp-mark{ width:9px; height:38px; background:var(--safety); border-radius:1px; flex:0 0 auto;
    box-shadow:0 0 16px rgba(234,168,0,.55); }
  .sp-txt{ text-align:left; }
  .sp-kick{ font-family:var(--mono); font-size:11px; letter-spacing:.34em; color:#F0B417; margin-bottom:3px; }
  .sp-title{ font-family:var(--disp); font-weight:700; font-size:clamp(20px,5.4vw,28px); letter-spacing:.03em; line-height:1.18; }
  .sp-bar{ width:min(66vw,230px); height:3px; border-radius:2px; background:rgba(255,255,255,.14); margin:22px auto 0; overflow:hidden; }
  .sp-bar > span{ display:block; height:100%; width:0; background:linear-gradient(90deg,#EAA800,#FFD65A); border-radius:2px; }
  @media (prefers-reduced-motion:no-preference){
    .sp-emblem .sp-draw{ animation:spdraw 1s ease forwards; }
    .sp-draw.d1{ animation-delay:.05s } .sp-draw.d2{ animation-delay:.20s } .sp-draw.d3{ animation-delay:.34s }
    .sp-draw.d4{ animation-delay:.48s } .sp-draw.d5{ animation-delay:.62s } .sp-draw.d6{ animation-delay:.74s }
    .sp-emblem .fillyl{ animation:spfill .5s ease .95s forwards; }
    .sp-word{ animation:spword .7s ease .55s forwards; }
    .sp-bar > span{ animation:spbar 3s ease .15s forwards; }
    @keyframes spdraw{ to{ stroke-dashoffset:0 } }
    @keyframes spfill{ to{ opacity:1 } }
    @keyframes spword{ to{ opacity:1; transform:none } }
    @keyframes spbar{ to{ width:100% } }
  }
  @media (prefers-reduced-motion:reduce){
    .sp-emblem .sp-draw{ stroke-dashoffset:0 } .sp-emblem .fillyl{ opacity:1 }
    .sp-word{ opacity:1; transform:none } .sp-bar>span{ width:100% }

<div class="stage">
  <div class="board">

    <div class="headline">
      <p class="kicker">CONSTRUCTION MGR</p>
      <h1 class="title">宗像総合管理システム</h1>
      <p>現場・工事台帳・勤怠</p>
    </div>

    <div id="msg" class="msg"></div>

    <form id="form" autocomplete="on">
      <div class="sheet">
        <div class="head">ログイン</div>

        <div class="row">
          <label for="email">メール<span class="req">*</span></label>
          <div class="fld">
            <input id="email" type="email" name="email" required
                   autocomplete="username" inputmode="email"
                   placeholder="example@example.com">
          </div>
        </div>

        <div class="row">
          <label for="password">パスワード<span class="req">*</span></label>
          <div class="fld">
            <input id="password" type="password" name="password" required
                   autocomplete="current-password" placeholder="">
          </div>
        </div>
      </div>

      <button id="go" class="btn wide" type="submit">ログイン</button>
    </form>

    <p class="foot">v20260909B</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function(){
  const msg  = document.getElementById('msg');
  const form = document.getElementById('form');
  const go   = document.getElementById('go');

  // 起動スプラッシュ：一定時間見せてから、ログイン画面へ（または既ログインなら遷移）
  const splash = document.getElementById('splash');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPLASH_MS = reduce ? 800 : 3300;
  const t0 = Date.now();
  const holdSplash = fn => setTimeout(fn, Math.max(0, SPLASH_MS - (Date.now() - t0)));
  const hideSplash = () => { if (!splash) return; splash.classList.add('gone'); setTimeout(() => splash.remove(), 650); };

  // ログイン後にどこへ進むか（指定が無ければメニュー一覧）
  const next = new URL(location.href).searchParams.get('next') || 'mode-select.html';

  // 既にログイン済みなら、スプラッシュを見せてから一覧へ
  const { data:{ session } } = await sb.auth.getSession();
  if (session) { holdSplash(() => location.replace(next)); return; }
  holdSplash(hideSplash);

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    showMsg(msg, '');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password){
      showMsg(msg, 'メールとパスワードを入力してください。', 'err');
      return;
    }

    go.disabled = true;
    go.textContent = '確認しています…';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error){
      go.disabled = false;
      go.textContent = 'ログイン';
      const m = /invalid login credentials/i.test(error.message)
        ? 'メールまたはパスワードが違います。'
        : 'ログインできませんでした。' + error.message;
      showMsg(msg, m, 'err');
      return;
    }

    location.replace(next);
  });
})();
</script>
